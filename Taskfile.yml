version: '3'

vars:
  REMOTE: origin
  MAIN_BRANCH: main
  # Optional transport flags, e.g. --ipv4 when IPv6 TLS is unavailable.
  GIT_NETWORK_FLAGS: ''
  # GOWORK=off matters: inside the workspace `go list -m` prints every module in
  # it, and MODULE has to name the root one alone.
  MODULE:
    sh: GOWORK=off go list -m

  # The repository holds two modules: the root one, which every integration
  # uses, and ./ydb, which is separate so that ydb-go-sdk and its gRPC
  # dependency tree stay out of the go.sum of integrations running on
  # PostgreSQL. Its tags are prefixed, as Go requires for a nested module.
  YDB_DIR: ydb
  YDB_TAG_PREFIX: ydb/

  # google.golang.org/genproto split googleapis/api and googleapis/rpc into
  # their own modules. ydb-go-yc still drags in a pre-split version, and in
  # workspace mode both copies end up in the build list, which makes every
  # import of those packages ambiguous. `go mod tidy` drops the pin because
  # nothing imports it directly, so tidy restores it right after.
  YDB_GENPROTO_PIN: google.golang.org/genproto@v0.0.0-20260819154853-08b0e4226688

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  fmt:
    desc: Format Go source files
    cmds:
      - gofmt -w .

  tidy:
    desc: Tidy Go module dependencies of both modules
    cmds:
      - go mod tidy
      # `go mod tidy` ignores go.work by design, so from inside ./ydb the parent
      # resolves to its last published tag — which does not yet contain whatever
      # is being added here. A replace supplies it for the length of the command
      # and is dropped straight after: a committed replace is forbidden.
      - |
        set -u
        cd {{.YDB_DIR}}
        go mod edit -replace={{.MODULE}}=..
        go mod tidy; status=$?
        go mod edit -dropreplace={{.MODULE}}
        go mod edit -require={{.YDB_GENPROTO_PIN}}
        exit $status

  vet:
    desc: Run go vet over both modules
    cmds:
      - go vet ./...
      - go vet ./{{.YDB_DIR}}/...

  test:
    desc: Run tests of both modules
    cmds:
      - go test ./...
      - go test ./{{.YDB_DIR}}/...

  test:lifecycle:
    desc: 'Verify lifecycle ordering, receipts and signed delivery (optional -- -race)'
    cmds:
      - go test ./integration -run '^TestLifecycle' -count=1 {{.CLI_ARGS}}

  check:
    desc: Run all local checks (fmt, tidy, vet, test)
    cmds:
      - task: fmt
      - task: tidy
      - task: vet
      - task: test

  version:
    desc: Show the current (latest) semver tag
    silent: true
    cmds:
      - 'git describe --tags --match "v[0-9]*.[0-9]*.[0-9]*" --abbrev=0 2>/dev/null || echo v0.0.0'

  release:preview:
    desc: 'Show what the next version would be. Usage: task release:preview [BUMP=patch|minor|major]'
    silent: true
    vars:
      BUMP: '{{.BUMP | default "patch"}}'
    cmds:
      - |
        set -eu
        latest=$(git describe --tags --match "v[0-9]*.[0-9]*.[0-9]*" --abbrev=0 2>/dev/null || echo v0.0.0)
        v=${latest#v}
        major=${v%%.*}; rest=${v#*.}; minor=${rest%%.*}; patch=${rest#*.}
        case "{{.BUMP}}" in
          major) major=$((major+1)); minor=0; patch=0 ;;
          minor) minor=$((minor+1)); patch=0 ;;
          patch) patch=$((patch+1)) ;;
          *) echo "unknown BUMP '{{.BUMP}}' (use patch|minor|major)" >&2; exit 1 ;;
        esac
        echo "current: $latest  ->  next ({{.BUMP}}): v${major}.${minor}.${patch}"

  push:
    desc: Push the current branch and all tags to the remote
    cmds:
      - git push {{.GIT_NETWORK_FLAGS}} {{.REMOTE}} HEAD
      - git push {{.GIT_NETWORK_FLAGS}} {{.REMOTE}} --tags

  release:
    desc: 'Tag and push a new semver release. Usage: task release [BUMP=patch|minor|major] or task release VERSION=v1.2.3'
    deps: [vet, test]
    vars:
      BUMP: '{{.BUMP | default "patch"}}'
      VERSION: '{{.VERSION | default ""}}'
    cmds:
      - |
        set -eu

        REMOTE="{{.REMOTE}}"
        MAIN_BRANCH="{{.MAIN_BRANCH}}"
        MODULE="{{.MODULE}}"
        BUMP="{{.BUMP}}"
        FORCED="{{.VERSION}}"

        # --- guards: only release a clean, up-to-date main ---
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" != "$MAIN_BRANCH" ]; then
          echo "release must run on '$MAIN_BRANCH' (current: '$branch')" >&2
          exit 1
        fi
        if [ -n "$(git status --porcelain)" ]; then
          echo "working tree is dirty; commit or stash your changes first" >&2
          exit 1
        fi
        git fetch {{.GIT_NETWORK_FLAGS}} "$REMOTE" --tags --quiet
        if [ -n "$(git rev-list HEAD..$REMOTE/$MAIN_BRANCH 2>/dev/null)" ]; then
          echo "local $MAIN_BRANCH is behind $REMOTE/$MAIN_BRANCH; pull first" >&2
          exit 1
        fi

        # --- compute next version ---
        if [ -n "$FORCED" ]; then
          next="$FORCED"
        else
          latest=$(git describe --tags --match "v[0-9]*.[0-9]*.[0-9]*" --abbrev=0 2>/dev/null || echo v0.0.0)
          v=${latest#v}
          major=${v%%.*}; rest=${v#*.}; minor=${rest%%.*}; patch=${rest#*.}
          case "$BUMP" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
            *) echo "unknown BUMP '$BUMP' (use patch|minor|major)" >&2; exit 1 ;;
          esac
          next="v${major}.${minor}.${patch}"
        fi

        # --- validate & ensure the tag is new ---
        case "$next" in
          v[0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "invalid version '$next' (expected vMAJOR.MINOR.PATCH)" >&2; exit 1 ;;
        esac
        if git rev-parse "$next" >/dev/null 2>&1; then
          echo "tag '$next' already exists" >&2
          exit 1
        fi

        echo "Releasing $MODULE $next ..."
        git tag -a "$next" -m "Release $next"
        git push {{.GIT_NETWORK_FLAGS}} "$REMOTE" "$MAIN_BRANCH"
        git push {{.GIT_NETWORK_FLAGS}} "$REMOTE" "$next"
        echo "Tagged and pushed $next"

        # --- prime the Go module proxy so 'go get' sees it immediately ---
        echo "Priming Go module proxy ..."
        GOPROXY=proxy.golang.org GOFLAGS= go list -m "$MODULE@$next" >/dev/null 2>&1 \
          || echo "proxy prime skipped (non-fatal)"
        echo "Done. Consume it with: go get $MODULE@$next"

  release:patch:
    desc: Release the next patch version (vX.Y.Z+1)
    cmds:
      - task: release
        vars: { BUMP: patch }

  release:minor:
    desc: Release the next minor version (vX.Y+1.0)
    cmds:
      - task: release
        vars: { BUMP: minor }

  release:major:
    desc: Release the next major version (vX+1.0.0)
    cmds:
      - task: release
        vars: { BUMP: major }

  release:ydb:
    desc: 'Tag and push the nested ydb module. Usage: task release:ydb [BUMP=patch|minor|major] or VERSION=v1.2.3'
    deps: [vet, test]
    vars:
      BUMP: '{{.BUMP | default "patch"}}'
      VERSION: '{{.VERSION | default ""}}'
    cmds:
      - |
        set -eu

        REMOTE="{{.REMOTE}}"
        MAIN_BRANCH="{{.MAIN_BRANCH}}"
        MODULE="{{.MODULE}}"
        PREFIX="{{.YDB_TAG_PREFIX}}"
        BUMP="{{.BUMP}}"
        FORCED="{{.VERSION}}"

        # --- guards: only release a clean, up-to-date main ---
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" != "$MAIN_BRANCH" ]; then
          echo "release must run on '$MAIN_BRANCH' (current: '$branch')" >&2
          exit 1
        fi
        if [ -n "$(git status --porcelain)" ]; then
          echo "working tree is dirty; commit or stash your changes first" >&2
          exit 1
        fi
        git fetch {{.GIT_NETWORK_FLAGS}} "$REMOTE" --tags --quiet

        # --- the ydb module must point at a published root version ---
        # Consumers of the ydb module resolve the root module through this
        # require, not through go.work, so a stale value ships a module that
        # cannot be built.
        root_latest=$(git describe --tags --match "v[0-9]*.[0-9]*.[0-9]*" --abbrev=0 2>/dev/null || echo "")
        if [ -z "$root_latest" ]; then
          echo "the root module has no release yet; run 'task release:minor' first" >&2
          exit 1
        fi
        # `go list -f '{{.Version}}'` cannot be written here: Task would
        # interpolate `.Version` itself. Strip the module path instead.
        required=$(GOWORK=off go list -m -modfile={{.YDB_DIR}}/go.mod "$MODULE")
        required=${required##* }
        if [ "$required" != "$root_latest" ]; then
          echo "{{.YDB_DIR}}/go.mod requires $MODULE $required but the latest release is $root_latest." >&2
          echo "Release the root module first, then run:" >&2
          echo "  (cd {{.YDB_DIR}} && go mod edit -require=$MODULE@$root_latest)" >&2
          echo "  git commit -am 'ydb: require $MODULE $root_latest'" >&2
          exit 1
        fi

        # --- compute next version from this module's own tags ---
        if [ -n "$FORCED" ]; then
          next="${PREFIX}${FORCED#$PREFIX}"
        else
          latest=$(git describe --tags --match "${PREFIX}v[0-9]*.[0-9]*.[0-9]*" --abbrev=0 2>/dev/null || echo "${PREFIX}v0.0.0")
          v=${latest#${PREFIX}v}
          major=${v%%.*}; rest=${v#*.}; minor=${rest%%.*}; patch=${rest#*.}
          case "$BUMP" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
            *) echo "unknown BUMP '$BUMP' (use patch|minor|major)" >&2; exit 1 ;;
          esac
          next="${PREFIX}v${major}.${minor}.${patch}"
        fi

        if git rev-parse "$next" >/dev/null 2>&1; then
          echo "tag '$next' already exists" >&2
          exit 1
        fi

        echo "Releasing $MODULE/{{.YDB_DIR}} $next ..."
        git tag -a "$next" -m "Release $next"
        git push {{.GIT_NETWORK_FLAGS}} "$REMOTE" "$MAIN_BRANCH"
        git push {{.GIT_NETWORK_FLAGS}} "$REMOTE" "$next"
        echo "Done. Consume it with: go get $MODULE/{{.YDB_DIR}}@${next#$PREFIX}"
